<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Uncle3 · 设置</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* 设置页独立成标签页打开，覆盖共享样式中的弹窗约束 */
  html, body { width: auto; }
  body { background: #f3f4f6; }
  .page { max-width: 420px; margin: 32px auto; background: #fff; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(15,23,42,.10); overflow: hidden; }

  .opt-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #111827;
    cursor: pointer; user-select: none; }
  .opt-line input { accent-color: #2563eb; }

  /* ---------- 预设管理列表 ---------- */
  .p-list { display: flex; flex-direction: column; gap: 8px; }
  .p-row { border: 1px solid #e5e7eb; border-radius: 10px; padding: 9px 10px; background: #fff;
    transition: box-shadow .15s; }
  .p-row[draggable="true"] { cursor: grab; }
  .p-row.dragging { opacity: .45; }
  .p-row.drop-before { box-shadow: 0 -3px 0 0 #2563eb; }
  .p-row.drop-after { box-shadow: 0 3px 0 0 #2563eb; }
  .p-main { display: flex; align-items: center; gap: 8px; }
  .p-handle { color: #c3c9d2; font-size: 14px; cursor: grab; user-select: none; }
  .p-lock { font-size: 11px; color: #9ca3af; background: #f3f4f6; border-radius: 6px; padding: 3px 8px; }
  .p-name { flex: 1; font-size: 13px; font-weight: 600; color: #111827; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .p-size { font-size: 12px; color: #9ca3af; font-variant-numeric: tabular-nums; }
  .p-actions { display: flex; gap: 6px; }
  .p-btn { border: none; background: #f3f4f6; color: #374151; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .p-btn:hover { background: #e5e7eb; }
  .p-btn.danger { background: #fee2e2; color: #dc2626; }
  .p-btn.danger:hover { background: #fecaca; }

  .p-edit { display: flex; flex-direction: column; gap: 8px; }
  .p-edit-row { display: flex; align-items: center; gap: 6px; }
  .p-edit input { padding: 7px 10px; border: 1px solid #e5e7eb; border-radius: 8px;
    font-size: 13px; outline: none; color: #111827; }
  .p-edit input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .p-edit .p-name-input { flex: 1; }
  .p-edit .p-size-input { width: 76px; }
  .p-edit .x { color: #9ca3af; font-size: 13px; }
  .p-edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .p-empty { font-size: 12px; color: #9ca3af; line-height: 1.7; }
</style>
</head>
<body>
  <div class="page">
    <div class="popup">
      <div class="toast" id="toast"></div>
      <header>
        <div class="brand-row">
          <div class="brand"><span class="logo">U</span>Uncle3 · 设置</div>
        </div>
      </header>

      <section class="panel">
        <!-- 录制设置 -->
        <div class="sec-title">录制设置</div>
        <label class="opt-line">
          <input type="checkbox" id="fpsChk"> 固定帧率（30fps）
        </label>
        <div class="hint">默认不勾选：帧率跟随页面内容（上限约 30fps，静止画面更省码率）。
          勾选后录制时锁定 30fps。</div>

        <div class="divider"></div>

        <!-- 预设尺寸管理 -->
        <div class="sec-title">预设尺寸管理</div>
        <div class="p-list" id="presetList"></div>
        <div class="hint">拖拽预设可调整顺序（弹窗内同步生效）；除内置的 HD 不可删除/改名外，
          其余预设均可点「编辑」修改名称或点「删除」移除。</div>
      </section>
    </div>
  </div>
  <script src="core.js"></script>
  <script src="settings.js"></script>
</body>
</html>
