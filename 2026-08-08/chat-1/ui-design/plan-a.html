<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uncle3 · 最终 UI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #eef1f5;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .caption { color: #6b7280; font-size: 14px; margin-bottom: 14px; letter-spacing: .5px; }

  /* ---------- 弹窗 ---------- */
  .popup {
    width: 340px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, .12);
    overflow: hidden;
    position: relative;
  }
  .toast {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: #111827; color: #fff; font-size: 12px;
    padding: 7px 14px; border-radius: 999px; opacity: 0;
    transition: all .25s ease; pointer-events: none; white-space: nowrap; z-index: 9;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  header { padding: 16px 16px 0; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-size: 16px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 22px; height: 22px; border-radius: 7px; background: #2563eb; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  .gear { width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent;
    color: #9ca3af; font-size: 16px; cursor: pointer; }
  .gear:hover { background: #f3f4f6; color: #374151; }

  .panel { padding: 0 16px 16px; }
  .sec-title {
    font-size: 12px; font-weight: 600; color: #6b7280;
    letter-spacing: .5px; margin-bottom: 8px;
  }
  .divider { height: 1px; background: #f3f4f6; margin: 14px 0; }

  /* ---------- 尺寸面板 ---------- */
  .current {
    background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #6b7280; margin-bottom: 12px;
  }
  .current b { color: #111827; font-size: 14px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .preset {
    border: 1px solid #e5e7eb; background: #fff; border-radius: 10px;
    padding: 9px 10px; text-align: left; cursor: pointer; transition: all .15s;
  }
  .preset:hover { border-color: #93c5fd; background: #f8fbff; }
  .preset.selected { border-color: #2563eb; background: #eff6ff; }
  .preset .name { font-size: 13px; font-weight: 600; color: #111827; }
  .preset .size { font-size: 11px; color: #9ca3af; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .custom { border-top: 1px solid #f3f4f6; padding-top: 12px; }
  .custom .label { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
  .custom-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .custom-row input {
    width: 86px; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 8px;
    font-size: 13px; outline: none; color: #111827;
  }
  .custom-row input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .custom-row .x { color: #9ca3af; font-size: 13px; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .btn-apply { background: #e5e7eb; color: #374151; flex: 1; }
  .btn-apply:hover { background: #d1d5db; }
  .btn-ghost { background: #f3f4f6; color: #374151; }
  .btn-ghost:hover { background: #e5e7eb; }
  .link-row { display: flex; gap: 8px; margin-top: 2px; }
  .link-row .btn { flex: 1; }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 10px; line-height: 1.6; }

  /* ---------- 录制面板 ---------- */
  .record-idle, .record-running, .record-encoding, .record-done { text-align: center; padding: 8px 0 6px; }
  .hidden { display: none !important; }

  .rec-btn {
    width: 100%; padding: 11px 0; border-radius: 10px; border: none;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .rec-btn:hover { background: #1d4ed8; }
  .rec-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .9; flex-shrink: 0; }

  .audio-row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: #6b7280; margin-top: 16px; cursor: pointer; user-select: none;
  }
  .audio-row input { accent-color: #2563eb; }
  .limit-tip { font-size: 11px; color: #9ca3af; margin-top: 8px; }

  .rec-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #ef4444; margin-bottom: 8px; }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink 1.1s infinite; }
  .rec-dot.paused { animation: none; background: #f59e0b; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .timer { font-size: 34px; font-weight: 700; color: #111827; font-variant-numeric: tabular-nums; margin-bottom: 16px; }
  .ctrl-row { display: flex; gap: 10px; justify-content: center; }
  .ctrl-row .btn { min-width: 104px; padding: 9px 0; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .state-text { font-size: 12px; color: #9ca3af; margin-top: 6px; height: 16px; }

  .spinner {
    width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #2563eb;
    border-radius: 50%; margin: 6px auto 14px; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .enc-text { font-size: 13px; color: #374151; }

  .done-icon { width: 46px; height: 46px; border-radius: 50%; background: #dcfce7; color: #16a34a;
    display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 4px auto 12px; }
  .done-file { font-size: 12px; color: #6b7280; background: #f8fafc; border: 1px solid #e5e7eb;
    border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; word-break: break-all; }
</style>
</head>
<body>
  <div class="caption">Uncle3 · 最终 UI 方案（可点击交互）</div>
  <div class="popup">
    <div class="toast" id="toast"></div>
    <header>
      <div class="brand-row">
        <div class="brand"><span class="dot">U</span>Uncle3</div>
        <button class="gear" title="设置" onclick="toast('设置（演示）')">⚙</button>
      </div>
    </header>

    <section class="panel">
      <div class="sec-title">窗口尺寸</div>
      <div class="current">当前窗口尺寸 <b id="curSize">1440 × 900</b></div>
      <div class="grid" id="presets"></div>
      <div class="custom">
        <div class="label">自定义尺寸（窗口像素）</div>
        <div class="custom-row">
          <input type="number" id="w" placeholder="宽" min="200" max="7680">
          <span class="x">×</span>
          <input type="number" id="h" placeholder="高" min="200" max="4320">
          <button class="btn btn-apply" onclick="applyCustom()">应用</button>
        </div>
        <div class="link-row">
          <button class="btn btn-ghost" onclick="toast('已保存为自定义预设（演示）')">+ 存为预设</button>
          <button class="btn btn-ghost" onclick="restore()">↩ 恢复上次尺寸</button>
        </div>
      </div>
      <div class="hint">注：调整的是浏览器窗口外框尺寸，页面可视区域会略小。</div>
      <div class="divider"></div>
      <div class="sec-title">页面录制</div>
      <div class="record-idle" id="st-idle">
        <button class="rec-btn" onclick="startRec()"><span class="dot"></span>开始录制</button>
        <label class="audio-row"><input type="checkbox" checked> 录制标签页声音</label>
        <div class="limit-tip">仅录制当前标签页 · 单次最长 10 分钟</div>
      </div>
      <div class="record-running hidden" id="st-running">
        <div class="rec-indicator"><span class="rec-dot" id="recDot"></span><span id="recStateText">正在录制当前标签页</span></div>
        <div class="timer" id="timer">00:00:00</div>
        <div class="ctrl-row">
          <button class="btn btn-ghost" id="pauseBtn" onclick="togglePause()">暂停</button>
          <button class="btn btn-danger" onclick="stopRec()">停止并导出</button>
        </div>
        <div class="state-text">关闭弹窗不会中断录制</div>
      </div>
      <div class="record-encoding hidden" id="st-encoding">
        <div class="spinner"></div>
        <div class="enc-text">正在生成 MP4，请稍候…</div>
      </div>
      <div class="record-done hidden" id="st-done">
        <div class="done-icon">✓</div>
        <div class="enc-text" style="margin-bottom:10px">视频已开始下载</div>
        <div class="done-file" id="doneFile">demo_20260808_203500.mp4</div>
        <div class="ctrl-row">
          <button class="btn btn-ghost" onclick="resetRec()">再录一次</button>
        </div>
      </div>
    </section>
  </div>

<script>
  const PRESETS = [
    ["iPhone 14 Pro", "393 × 852"], ["iPad Mini", "768 × 1024"],
    ["HD", "1280 × 720"], ["Full HD", "1920 × 1080"]
  ];
  const grid = document.getElementById("presets");
  PRESETS.forEach(([n, s]) => {
    const b = document.createElement("button");
    b.className = "preset";
    b.innerHTML = `<div class="name">${n}</div><div class="size">${s}</div>`;
    b.onclick = () => {
      document.querySelectorAll(".preset").forEach(p => p.classList.remove("selected"));
      b.classList.add("selected");
      document.getElementById("curSize").textContent = s;
      toast(`已调整为 ${s}`);
    };
    grid.appendChild(b);
  });

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function applyCustom() {
    const w = +document.getElementById("w").value, h = +document.getElementById("h").value;
    if (!w || !h) return toast("请输入宽度和高度");
    if (w < 200 || w > 7680 || h < 200 || h > 4320) return toast("超出范围：200–7680 / 200–4320");
    document.getElementById("curSize").textContent = `${w} × ${h}`;
    document.querySelectorAll(".preset").forEach(p => p.classList.remove("selected"));
    toast(`已调整为 ${w} × ${h}`);
  }
  function restore() {
    document.getElementById("curSize").textContent = "1440 × 900";
    document.querySelectorAll(".preset").forEach(p => p.classList.remove("selected"));
    toast("已恢复上次尺寸");
  }

  let sec = 0, tick = null, paused = false;
  const fmt = s => [s/3600, s/60%60, s%60].map(v => String(Math.floor(v)).padStart(2, "0")).join(":");
  function startRec() {
    sec = 0; paused = false;
    show("st-running");
    tick = setInterval(() => { if (!paused) { sec++; document.getElementById("timer").textContent = fmt(sec); } }, 1000);
    toast("录制已开始（演示）");
  }
  function togglePause() {
    paused = !paused;
    document.getElementById("pauseBtn").textContent = paused ? "继续" : "暂停";
    document.getElementById("recDot").classList.toggle("paused", paused);
    document.getElementById("recStateText").textContent = paused ? "已暂停" : "正在录制当前标签页";
  }
  function stopRec() {
    clearInterval(tick);
    show("st-encoding");
    setTimeout(() => {
      const d = new Date(), p = n => String(n).padStart(2, "0");
      document.getElementById("doneFile").textContent =
        `demo_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.mp4`;
      show("st-done");
    }, 1500);
  }
  function resetRec() { show("st-idle"); }
  function show(id) {
    ["st-idle", "st-running", "st-encoding", "st-done"].forEach(i =>
      document.getElementById(i).classList.toggle("hidden", i !== id));
  }
</script>
</body>
</html>
