<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Uncle3 · 集成仿真测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #eef1f5; display: flex; gap: 32px; justify-content: center;
    padding: 32px 16px; align-items: flex-start; flex-wrap: wrap;
  }
  .popup-wrap { flex-shrink: 0; }
  .popup-wrap h2, .results-wrap h2 { font-size: 14px; color: #6b7280; margin-bottom: 12px; }
  .popup {
    width: 340px; background: #fff; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(15,23,42,.12); overflow: hidden; position: relative;
  }
  .results-wrap { width: 520px; }
  #summary { font-size: 14px; font-weight: 700; margin-bottom: 10px; padding: 10px 14px;
    border-radius: 10px; background: #e5e7eb; color: #374151; }
  #summary.ok { background: #dcfce7; color: #15803d; }
  #summary.bad { background: #fee2e2; color: #b91c1c; }
  #results { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.9;
    background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 4px 16px rgba(15,23,42,.08); }
  #results .pass { color: #15803d; }
  #results .fail { color: #b91c1c; font-weight: 700; }
</style>
<!-- 复用 popup.html 的样式 -->
<style>
  .toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: #111827; color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 999px;
    opacity: 0; transition: all .25s ease; pointer-events: none; white-space: nowrap; z-index: 9;
    max-width: 310px; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  header { padding: 16px 16px 12px; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 16px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 22px; height: 22px; border-radius: 7px; background: #2563eb; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  .panel { padding: 0 16px 16px; }
  .sec-title { font-size: 12px; font-weight: 600; color: #6b7280; letter-spacing: .5px; margin-bottom: 8px; }
  .divider { height: 1px; background: #f3f4f6; margin: 14px 0; }
  .current { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px;
    display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6b7280; margin-bottom: 12px; }
  .current b { color: #111827; font-size: 14px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .preset { position: relative; border: 1px solid #e5e7eb; background: #fff; border-radius: 10px;
    padding: 9px 10px; text-align: left; cursor: pointer; transition: all .15s; }
  .preset.selected { border-color: #2563eb; background: #eff6ff; }
  .preset .name { font-size: 13px; font-weight: 600; color: #111827; padding-right: 14px; }
  .preset .size { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .preset .del { position: absolute; top: 5px; right: 6px; width: 16px; height: 16px; border: none;
    background: transparent; color: #c3c9d2; cursor: pointer; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; }
  .custom { border-top: 1px solid #f3f4f6; padding-top: 12px; }
  .custom .label { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
  .custom-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .custom-row input { width: 86px; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; }
  .custom-row .x { color: #9ca3af; font-size: 13px; }
  .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .btn-apply { background: #e5e7eb; color: #374151; flex: 1; }
  .btn-ghost { background: #f3f4f6; color: #374151; }
  .btn-danger { background: #ef4444; color: #fff; }
  .link-row { display: flex; gap: 8px; margin-top: 2px; }
  .link-row .btn { flex: 1; }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 10px; }
  .save-form { display: none; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; margin-top: 10px; }
  .save-form.show { display: block; }
  .save-form input { width: 100%; padding: 7px 10px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; }
  .save-form .row { display: flex; gap: 8px; }
  .save-form .row .btn { flex: 1; }
  .rec-area { text-align: center; padding: 6px 0 2px; }
  .hidden { display: none !important; }
  .rec-btn { width: 100%; padding: 11px 0; border-radius: 10px; border: none; background: #2563eb;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .rec-btn:disabled { opacity: .55; }
  .rec-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .opt-row { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 12px; color: #6b7280; margin-top: 12px; }
    .opt-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .opt-row input { accent-color: #2563eb; }
  .limit-tip { font-size: 11px; color: #9ca3af; margin-top: 8px; }
  .rec-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #ef4444; margin-bottom: 8px; }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; }
  .rec-dot.paused { background: #f59e0b; }
  .timer { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 14px; }
  .ctrl-row { display: flex; gap: 10px; justify-content: center; }
  .ctrl-row .btn { min-width: 104px; padding: 9px 0; }
  .state-text { font-size: 12px; color: #9ca3af; margin-top: 8px; min-height: 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; margin: 8px auto 14px; }
  .enc-text { font-size: 13px; color: #374151; }
  .done-icon { width: 46px; height: 46px; border-radius: 50%; background: #dcfce7; color: #16a34a;
    display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 6px auto 12px; }
  .done-file { font-size: 12px; color: #6b7280; background: #f8fafc; border: 1px solid #e5e7eb;
    border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; word-break: break-all; }
  .done-hint { font-size: 11px; color: #9ca3af; line-height: 1.6; margin-bottom: 12px; padding: 0 4px; text-align: left; }
  .err-icon { width: 46px; height: 46px; border-radius: 50%; background: #fee2e2; color: #dc2626;
    display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 6px auto 12px; }
  .err-text { font-size: 12px; color: #6b7280; margin-bottom: 14px; line-height: 1.6; }
  .gear-btn { width: 28px; height: 28px; border: none; background: transparent; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: #9ca3af; }
</style>
</head>
<body>
  <div class="popup-wrap">
    <h2>弹窗（真实代码驱动，自动执行中）</h2>
    <!-- ===== 与 popup.html 完全一致的弹窗结构 ===== -->
    <div class="popup">
      <div class="toast" id="toast"></div>
      <header>
        <div class="brand-row">
          <div class="brand"><span class="logo">U</span>Uncle3</div>
          <button class="gear-btn" id="settingsBtn" title="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
        </div>
      </header>
      <section class="panel">
        <div class="sec-title">窗口尺寸</div>
        <div class="current">当前窗口尺寸 <b id="curSize">-- × --</b></div>
        <div class="grid" id="presets"></div>
        <div class="custom">
          <div class="label">自定义尺寸（窗口像素）</div>
          <div class="custom-row">
            <input type="number" id="w" placeholder="宽" min="200" max="7680">
            <span class="x">×</span>
            <input type="number" id="h" placeholder="高" min="200" max="4320">
            <button class="btn btn-apply" id="applyBtn">应用</button>
          </div>
          <div class="link-row">
            <button class="btn btn-ghost" id="saveFormBtn">+ 存为预设</button>
            <button class="btn btn-ghost" id="restoreBtn">↩ 恢复上次尺寸</button>
          </div>
          <div class="save-form" id="saveForm">
            <input type="text" id="presetName" placeholder="预设名称" maxlength="20">
            <div class="row">
              <button class="btn btn-ghost" id="saveCancelBtn">取消</button>
              <button class="btn btn-apply" id="saveConfirmBtn">保存</button>
            </div>
          </div>
        </div>
        <div class="hint">注：调整的是浏览器窗口外框尺寸，页面可视区域会略小。</div>
        <div class="divider"></div>
        <div class="sec-title">页面录制</div>
        <div class="rec-area">
          <div id="st-idle">
            <button class="rec-btn" id="recBtn"><span class="dot"></span><span id="recBtnText">开始录制</span></button>
            <div class="opt-row">
              <label><input type="checkbox" id="audioChk" checked> 录制标签页声音</label>
              <label title="取消勾选则直接存储 WebM 格式"><input type="checkbox" id="mp4Chk" checked> 导出 MP4 格式</label>
            </div>
            <div class="limit-tip" id="idleTip">仅录制当前标签页 · 单次最长 10 分钟</div>
          </div>
          <div id="st-running" class="hidden">
            <div class="rec-indicator"><span class="rec-dot" id="recDot"></span><span id="recStateText">正在录制当前标签页</span></div>
            <div class="timer" id="timer">00:00:00</div>
            <div class="ctrl-row">
              <button class="btn btn-ghost" id="pauseBtn">暂停</button>
              <button class="btn btn-danger" id="stopBtn">停止并导出</button>
            </div>
            <div class="state-text">关闭弹窗不会中断录制</div>
          </div>
          <div id="st-encoding" class="hidden">
            <div class="spinner"></div>
            <div class="enc-text">正在生成视频，请稍候…</div>
          </div>
          <div id="st-done" class="hidden">
            <div class="done-icon">✓</div>
            <div class="enc-text" style="margin-bottom:10px" id="doneTitle">视频已导出</div>
            <div class="done-file" id="doneFile"></div>
            <div class="done-hint" id="doneHint"></div>
            <div class="ctrl-row">
              <button class="btn btn-ghost" id="againBtn">再录一次</button>
            </div>
          </div>
          <div id="st-error" class="hidden">
            <div class="err-icon">!</div>
            <div class="err-text" id="errText"></div>
            <div class="ctrl-row">
              <button class="btn btn-ghost" id="errCloseBtn">关闭</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="results-wrap">
    <h2>集成测试结果</h2>
    <div id="summary">测试运行中…</div>
    <div id="results"></div>
  </div>

  <!-- mock 必须内联：保证与后续脚本处于同一 JS 作用域（外部引入可能被隔离导致 mock 失效） -->
  <script>
// ===== chrome.* API 与媒体录制环境的浏览器端 Mock =====
(function () {
  const state = {
    win: { id: 1, width: 1440, height: 900 },
    screen: { w: 3000, h: 2000 },
    store: {},
    sessionStore: {},
    offscreenOpen: false,
    badge: '',
    badgeColor: '',
    downloads: [],
    windowUpdates: [],
    tab: { id: 42, title: 'Demo 演示页面', url: 'https://example.com/demo' },
    gumFail: false,
    gumConstraints: null,
    tabCaptureFail: false,
    stopDelay: 0, // MediaRecorder.stop() 触发 finalize 的延迟（>0 时模拟慢导出/大文件编码，制造 offscreen 忙窗口）
    msgLog: [],
    lastError: null,
    optionsOpened: false
  };
  window.__sim = state;

  const listeners = [];

  window.importScripts = function () { /* core.js 已单独加载，忽略 */ };

  window.chrome = {
    storage: {
      local: {
        get(keys) {
          return Promise.resolve().then(() => {
            if (typeof keys === 'string') return { [keys]: state.store[keys] };
            if (Array.isArray(keys)) {
              const out = {};
              keys.forEach(k => { out[k] = state.store[k]; });
              return out;
            }
            if (keys && typeof keys === 'object') {
              const out = {};
              Object.keys(keys).forEach(k => { out[k] = state.store[k] !== undefined ? state.store[k] : keys[k]; });
              return out;
            }
            return { ...state.store };
          });
        },
        set(obj) {
          return Promise.resolve().then(() => { Object.assign(state.store, obj); });
        }
      },
      session: {
        get(keys) {
          return Promise.resolve().then(() => {
            if (typeof keys === 'string') return { [keys]: state.sessionStore[keys] };
            if (Array.isArray(keys)) {
              const out = {};
              keys.forEach(k => { out[k] = state.sessionStore[k]; });
              return out;
            }
            if (keys && typeof keys === 'object') {
              const out = {};
              Object.keys(keys).forEach(k => { out[k] = state.sessionStore[k] !== undefined ? state.sessionStore[k] : keys[k]; });
              return out;
            }
            return { ...state.sessionStore };
          });
        },
        set(obj) { return Promise.resolve().then(() => { Object.assign(state.sessionStore, obj); }); },
        remove(key) {
          return Promise.resolve().then(() => {
            if (Array.isArray(key)) key.forEach(k => delete state.sessionStore[k]);
            else delete state.sessionStore[key];
          });
        }
      }
    },
    windows: {
      getCurrent() { return Promise.resolve({ ...state.win }); },
      update(id, props) {
        state.windowUpdates.push({ ...props });
        // 模拟屏幕钳制
        state.win.width = Math.min(props.width || state.win.width, state.screen.w);
        state.win.height = Math.min(props.height || state.win.height, state.screen.h);
        return Promise.resolve({ ...state.win });
      }
    },
    tabs: {
      query() { return Promise.resolve([{ ...state.tab }]); }
    },
    tabCapture: {
      getMediaStreamId(opts) {
        if (state.tabCaptureFail) return Promise.reject(new Error('用户拒绝了录制授权'));
        return Promise.resolve('stream-' + (opts.targetTabId || 0));
      }
    },
    action: {
      setBadgeText(o) { state.badge = o.text; },
      setBadgeBackgroundColor(o) { state.badgeColor = o.color; }
    },
    offscreen: {
      hasDocument() { return Promise.resolve(state.offscreenOpen); },
      createDocument() { state.offscreenOpen = true; return Promise.resolve(); },
      closeDocument() { state.offscreenOpen = false; return Promise.resolve(); }
    },
    downloads: {
      download(opts, cb) {
        state.downloads.push({ filename: opts.filename, urlHead: String(opts.url).slice(0, 30) });
        if (cb) cb();
      }
    },
    runtime: {
      getURL(p) { return 'chrome-extension://sim/' + p; },
      openOptionsPage() { state.optionsOpened = true; return Promise.resolve(); },
      get lastError() { return state.lastError; },
      onMessage: {
        addListener(fn) { listeners.push(fn); }
      },
      sendMessage(msg, cb) {
        state.msgLog.push(msg);
        return new Promise((resolve, reject) => {
          // 贴近真实 Chrome：发给 offscreen 的消息（OFF_*）在文档不存在时没有任何接收端，
          // 不应投递给任何监听器，Promise 直接 reject，否则看门狗逻辑无法被仿真验证
          if (/^OFF_/.test(String(msg && msg.type || '')) && !state.offscreenOpen) {
            if (cb) cb(undefined);
            reject(new Error('Could not establish connection. Receiving end does not exist.'));
            return;
          }
          let responded = false;
          const done = resp => {
            if (!responded) { responded = true; if (cb) cb(resp); resolve(resp); }
          };
          let anyAsync = false;
          for (const fn of listeners.slice()) {
            const ret = fn(msg, { id: 'sim-context' }, done);
            if (ret === true) { anyAsync = true; continue; }
            if (ret !== undefined) { done(ret); break; }
          }
          if (!anyAsync && !responded) done(undefined);
        });
      }
    }
  };

  // ---------- MediaRecorder Mock ----------
  window.MediaRecorder = class {
    static isTypeSupported(m) { return /^video\/(mp4|webm)/.test(m); }
    constructor(stream, opts) {
      this.state = 'inactive';
      this.mimeType = (opts && opts.mimeType) || 'video/webm';
    }
    start() { this.state = 'recording'; }
    pause() { if (this.state === 'recording') this.state = 'paused'; }
    resume() { if (this.state === 'paused') this.state = 'recording'; }
    stop() {
      this.state = 'inactive';
      const delay = state.stopDelay || 0;
      setTimeout(() => {
        if (this.ondataavailable) {
          this.ondataavailable({ data: new Blob(['fake-video-data'], { type: this.mimeType }) });
        }
        if (this.onstop) this.onstop();
      }, delay);
    }
  };

  // ---------- getUserMedia Mock ----------
  window.navigator.mediaDevices = window.navigator.mediaDevices || {};
  window.navigator.mediaDevices.getUserMedia = function (constraints) {
    state.gumConstraints = constraints;
    if (state.gumFail) return Promise.reject(new Error('NotAllowedError'));
    const track = { stop() { }, addEventListener() { } };
    return Promise.resolve({
      getTracks() { return [track]; },
      getVideoTracks() { return [track]; },
      getAudioTracks() { return constraints.audio ? [track] : []; }
    });
  };

  // ---------- 锚点下载拦截（offscreen 以 <a download> 发起导出） ----------
  const origAnchorClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (this.hasAttribute && this.hasAttribute('download')) {
      state.downloads.push({
        filename: this.getAttribute('download'),
        urlHead: String(this.href).slice(0, 30)
      });
      return;
    }
    return origAnchorClick.call(this);
  };
})();
  </script>

  <script src="../background.js?v=8"></script>
